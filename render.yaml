services:
  - type: web
    name: ai-team-server
    runtime: node
    rootDir: ai_team_server
    buildCommand: npm ci && npm run prisma:migrate:deploy && npm run build
    # Not `npm run start:prod`: its prestart hook recompiles the app that
    # buildCommand just built, delaying the health check on every boot.
    startCommand: node dist/main.js
    healthCheckPath: /
    autoDeploy: true
